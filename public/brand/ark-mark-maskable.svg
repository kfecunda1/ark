<!--
  Derived from ark-mark.svg for the three manifest icons (icon-192,
  icon-512, icon-512-maskable) — full-bleed background (no rx; the OS
  applies its own corner/circle mask on top of this, which a
  pre-rounded source would clash with) and the A+arrow mark scaled to
  ~70% around the canvas center (90,90) so it stays inside Android's
  adaptive-icon safe zone once masked. Same two path/stroke colors and
  gradient as the original; only the geometry changed.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f4c73"/><stop offset="1" stop-color="#0a1018"/></linearGradient></defs>
<rect width="180" height="180" fill="url(#g)"/>
<path d="M62 122.2 L90 57.8 L118 122.2" fill="none" stroke="#e3eaf1" stroke-width="9.1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M67.6 102.6 H109.6" fill="none" stroke="#9fc6e8" stroke-width="7" stroke-linecap="round"/>
<path d="M104 94.2 L115.2 102.6 L104 111" fill="none" stroke="#9fc6e8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
